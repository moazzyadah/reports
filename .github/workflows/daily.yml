name: Daily Ads Report

on:
  schedule:
    - cron: '0 5 * * *'   # 8:00 AM Cairo (UTC+3)
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run daily report & send WhatsApp
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          EVOLUTION_URL: ${{ secrets.EVOLUTION_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
        run: python daily_report.py | python send_whatsapp.py
